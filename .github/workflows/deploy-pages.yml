# Pubblica il sito su gh-pages a ogni push su main (o a mano da Actions → «Deploy GitHub Pages» → Run workflow).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: TypeScript (stessa versione usata in locale)
        run: npm install -g typescript@5.6.3

      - name: Suite Node (funzionali e regressione) — blocca il deploy se fallisce
        run: node 07-SUITE-TEST-FUNZIONALI-E-REGRESSIONE.mjs

      - name: Build
        run: node build.mjs

      - name: Service worker senza segnaposto __VERSIONE__
        run: "! grep -q __VERSIONE__ dist/sw.js"

      - name: Togli l'anteprima a file unico (non va pubblicata)
        run: rm -f dist/anteprima.html

      - name: Pubblica dist su gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true   # come la copia manuale: i file già presenti su gh-pages e non generati restano
          commit_message: "Pubblica ${{ github.sha }}"
