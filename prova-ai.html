<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova spiegazioni AI</title>
<style>:root{--bg:#f6f5f2;--fg:#1d1d1f;--card:#fff;--mut:#6b6b70;--acc:#2f6fdb;--ok:#1f8a4c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121214;--fg:#eee;--card:#1d1d21;--mut:#9a9aa2;--acc:#6ea0ff;--ok:#4fc27f}}
:root[data-theme=dark]{--bg:#121214;--fg:#eee;--card:#1d1d21;--mut:#9a9aa2;--acc:#6ea0ff;--ok:#4fc27f}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif}main{max-width:720px;margin:auto;padding:16px}
.c{background:var(--card);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #8886;background:var(--card);color:var(--fg);max-width:100%}
input{width:100%;box-sizing:border-box}button{background:var(--acc);color:#fff;border:0;margin:4px 4px 0 0}.ok{color:var(--ok);font-weight:600}.m{color:var(--mut);font-size:14px}.out{white-space:pre-wrap;margin-top:10px;border-top:1px solid #8883;padding-top:8px}</style></head><body><main>
<h1>Prova spiegazioni AI</h1><p class="m">La chiave resta solo su questo dispositivo (memoria del browser). Nulla va su Drive.</p>
<div class="c"><label>Chiave Groq<input id="k" type="password" placeholder="gsk_..."></label>
<p><button id="sv">Salva chiave</button> <button id="lm">Carica modelli</button><br><select id="mod"><option>llama-3.3-70b-versatile</option></select></p><p id="st" class="m"></p></div>
<div id="qs"></div></main><script>
const Q=[
 {
  "q": "Un catalizzatore modifica la costante di equilibrio K?",
  "ok": "No",
  "wrong": [
   "Sì, la aumenta",
   "Sì, la diminuisce",
   "Solo se la reazione è esotermica",
   "Solo per le reazioni tra gas"
  ],
  "cit": "Non si consuma: non serve in rapporto stechiometrico. […] Basta in quantità molto piccole. • Non sposta l’equilibrio: cambia solo la velocità."
 },
 {
  "q": "Una reazione con ΔG > 0 in presenza di un enzima:",
  "ok": "Resta sfavorita",
  "wrong": [
   "Diventa spontanea",
   "Diventa esotermica",
   "Ha K più grande",
   "Ha ΔG negativo"
  ],
  "cit": "Non si consuma: non serve in rapporto stechiometrico. […] Basta in quantità molto piccole. • Non sposta l’equilibrio: cambia solo la velocità.\nMolti enzimi sono proteine ma esistono anche RNA catalitici o ribozimi. […] Come gli altri catalizzatori, gli enzimi non modificano ΔG° o K della reazione."
 },
 {
  "q": "Una reazione esotermica con prodotti molto più stabili può non avvenire perché:",
  "ok": "Serve comunque superare l'energia di attivazione",
  "wrong": [
   "In realtà è endotermica",
   "Ha ΔG positivo",
   "Non ci sono prodotti possibili",
   "Lo vieta il secondo principio della termodinamica"
  ],
  "cit": "I prodotti possono avere energia inferiore ai reagenti, ma la trasformazione non avviene finché le molecole non acquistano l’energia di attivazione Ea. […] La barriera Ea controlla la velocità: più è alta, minore è la frazione di molecole che riesce a superarla."
 },
 {
  "q": "Differenza tra stato di transizione e intermedio:",
  "ok": "ST massimo, intermedio minimo",
  "wrong": [
   "Sono la stessa cosa",
   "Il ST si può isolare in provetta",
   "L'intermedio è sempre un massimo",
   "Il ST compare nell'equazione globale"
  ],
  "cit": "Il complesso attivato è instabile e non è isolabile. Non è un intermedio: un intermedio occupa un minimo locale fra due barriere e ha una durata finita."
 },
 {
  "q": "Guarda l'immagine: l'aumento di temperatura accelera le reazioni soprattutto perché:",
  "ok": "Più molecole superano Ea",
  "wrong": [
   "Ea diminuisce",
   "ΔG diventa più negativo",
   "Le molecole diventano più leggere",
   "Si forma un catalizzatore"
  ],
  "cit": "Al crescere della temperatura aumentano la frequenza degli urti e la quota di particelle abbastanza energetiche. […] Questo è il fattore principale responsabile del repentino aumento della velocità di reazione all’aumentare della temperatura.\nLa distribuzione di Maxwell–Boltzmann si abbassa e si allarga verso energie maggiori. L’area totale resta costante, ma cresce la frazione di particelle a destra di Ea."
 }
];
const L={breve:"in 2-3 frasi",media:"in un paragrafo di 5-7 frasi, con il ragionamento passo passo",dettagliata:"in modo approfondito: ragionamento passo passo, perché ciascuna risposta sbagliata è sbagliata, e un trucco per ricordarlo"};
const $=s=>document.querySelector(s);let key="";try{key=localStorage.getItem("gk")||""}catch(e){}$("#k").value=key;
$("#sv").onclick=()=>{key=$("#k").value.trim();try{localStorage.setItem("gk",key)}catch(e){}$("#st").textContent="Chiave salvata."};
$("#lm").onclick=async()=>{try{const r=await fetch("https://api.groq.com/openai/v1/models",{headers:{Authorization:"Bearer "+key}});const j=await r.json();if(!r.ok)throw Error(j.error&&j.error.message||r.status);
$("#mod").innerHTML=j.data.map(m=>m.id).filter(i=>!/whisper|guard|tts|orpheus/i.test(i)).sort().map(i=>'<option'+(i=="llama-3.3-70b-versatile"?' selected':'')+'>'+i+'</option>').join("");$("#st").textContent="Modelli caricati."}catch(e){$("#st").textContent="Errore: "+e.message}};
Q.forEach((q,i)=>{const d=document.createElement("div");d.className="c";d.innerHTML='<b>'+(i+1)+'. '+q.q+'</b><p class="ok">✓ '+q.ok+'</p><p class="m">Sbagliate: '+q.wrong.join(" · ")+'</p>'+Object.keys(L).map(l=>'<button data-l="'+l+'">'+l+'</button>').join("")+'<div class="out"></div>';
d.querySelectorAll("button").forEach(b=>b.onclick=()=>go(q,b.dataset.l,d.querySelector(".out")));$("#qs").append(d)});
async function go(q,l,o){if(!key){o.textContent="Prima salva la chiave.";return}o.textContent="Genero…";const t0=Date.now();
const sys="Sei un tutor di Chimica per il semestre filtro di Medicina. Rispondi in italiano corretto e semplice. Basati SOLO sul testo di riferimento fornito e su conoscenze di chimica generale certe; non inventare dati. Non usare markdown.";
const usr="Domanda: "+q.q+"\nRisposta corretta: "+q.ok+"\nRisposte sbagliate: "+q.wrong.join("; ")+"\nTesto di riferimento (dal corso): "+q.cit+"\n\nSpiega perché la risposta corretta è giusta "+L[l]+".";
try{const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{Authorization:"Bearer "+key,"Content-Type":"application/json"},body:JSON.stringify({model:$("#mod").value,temperature:0.3,messages:[{role:"system",content:sys},{role:"user",content:usr}]})});
const j=await r.json();if(!r.ok)throw Error(j.error&&j.error.message||r.status);o.textContent=j.choices[0].message.content+"\n\n("+$("#mod").value+", "+((Date.now()-t0)/1000).toFixed(1)+" s)"}catch(e){o.textContent="Errore: "+e.message}}
</script></body></html>
